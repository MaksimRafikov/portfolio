<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
  <title>Schema: bot dialogue</title>
  <rect width="640" height="360" fill="#f8f6f1"/>
  <rect x="32" y="28" width="576" height="304" fill="#fefdfb" stroke="#e2ddd2" stroke-width="1"/>
  <text x="52" y="58" font-family="Consolas, monospace" font-size="12" fill="#7f848d" letter-spacing="1.5">TELEGRAM · MVP</text>
  <text x="52" y="88" font-family="Georgia, serif" font-size="22" fill="#16181b">Напоминание своими словами</text>
  <g font-family="Segoe UI, sans-serif" font-size="15">
    <rect x="280" y="112" width="280" height="44" rx="8" fill="#f1e6df"/>
    <text x="296" y="140" fill="#16181b">позвони завтра в 9:00</text>
    <rect x="52" y="172" width="320" height="52" rx="8" fill="#e2ddd2"/>
    <text x="68" y="194" fill="#16181b">Ок. Напомню завтра в 09:00</text>
    <text x="68" y="214" fill="#4c515a" font-size="13">часовой пояс: Урал</text>
  </g>
  <g font-family="Consolas, monospace" font-size="12">
    <rect x="52" y="250" width="100" height="36" rx="2" fill="#16181b"/>
    <text x="70" y="272" fill="#fefdfb">сделано</text>
    <rect x="164" y="250" width="100" height="36" rx="2" fill="#fefdfb" stroke="#cdc6b7"/>
    <text x="186" y="272" fill="#4c515a">15 мин</text>
    <rect x="276" y="250" width="100" height="36" rx="2" fill="#fefdfb" stroke="#cdc6b7"/>
    <text x="300" y="272" fill="#4c515a">1 час</text>
    <rect x="388" y="250" width="100" height="36" rx="2" fill="#fefdfb" stroke="#cdc6b7"/>
    <text x="410" y="272" fill="#4c515a">завтра</text>
  </g>
  <text x="52" y="318" font-family="Consolas, monospace" font-size="13" fill="#a6431e">дедлайн · повтор · отложить</text>
</svg>
